<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ULO AI</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            yellow: '#ffde59',
                            purple: '#6b21a8'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        h1, h2, h3, h4 {
            font-family: 'Montserrat', sans-serif;
        }

        /* Sidebar Transition */
        .sidebar {
            transition: transform 0.3s ease-in-out;
            transform: translateX(100%);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        /* Smooth Fade In */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800">

    <div id="header"></div>

    <section class="relative pt-32 pb-20 bg-gradient-to-br from-yellow-50 via-purple-50 to-white overflow-hidden">
        
        <div class="absolute inset-0 pointer-events-none">
            <div class="absolute w-96 h-96 bg-purple-200/30 rounded-full -top-20 -left-20 blur-3xl animate-pulse"></div>
            <div class="absolute w-80 h-80 bg-yellow-200/40 rounded-full top-1/2 right-0 blur-3xl"></div>
        </div>

        <div class="container mx-auto px-6 relative z-10">
            <div class="text-center mb-12 fade-in">
                <span class="text-brand-purple font-semibold tracking-wider uppercase text-sm">Get in touch</span>
                <h2 class="text-4xl md:text-5xl font-bold mt-2 mb-4 text-gray-900">Contact Us</h2>
                <p class="text-lg text-gray-600 max-w-2xl mx-auto">
                    Have questions, feedback, or want to partner with us? We'd love to hear from you!
                </p>
            </div>

            <div class="grid lg:grid-cols-2 gap-12 items-start max-w-6xl mx-auto">

               <div class="bg-white p-8 md:p-10 rounded-3xl shadow-xl border border-gray-100 fade-in">
                    <h3 class="text-2xl font-bold mb-6 text-gray-900">Send us a message</h3>
                    
                    <form id="contactForm" class="space-y-5">
                        <div class="grid md:grid-cols-2 gap-5">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Name</label>
                                <input type="text" id="name" name="name" required placeholder="John Doe" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-yellow focus:border-transparent outline-none transition" />
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                                <input type="email" id="email" name="email" required placeholder="john@example.com" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-yellow focus:border-transparent outline-none transition" />
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Subject</label>
                            <input type="text" id="subject" name="subject" required placeholder="How can we help?" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-yellow focus:border-transparent outline-none transition" />
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Message</label>
                            <textarea id="message" name="message" rows="5" required placeholder="Write your message here..." class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-yellow focus:border-transparent outline-none transition resize-none"></textarea>
                        </div>
                        
                        <button type="submit" id="submitBtn" class="w-full bg-brand-yellow text-gray-900 font-bold py-4 rounded-xl shadow-lg hover:bg-yellow-400 hover:shadow-xl transition transform hover:-translate-y-1">
                            Send Message
                        </button>
                        
                        <p id="formStatus" class="text-center font-bold hidden"></p>
                    </form>
                </div>

                <div class="flex flex-col space-y-6 fade-in" style="animation-delay: 0.2s;">
                    <div class="p-6 bg-white rounded-2xl shadow-md hover:shadow-lg transition flex items-center space-x-5 border border-gray-50">
                        <div class="w-14 h-14 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center text-2xl">
                            <i class="fas fa-phone-alt"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-gray-900 text-lg">Phone</h4>
                            <p class="text-gray-600">+234 9061616524 </p>
                            <p class="text-sm text-gray-400">Mon-Fri from 8am to 5pm</p>
                        </div>
                    </div>

                    <div class="p-6 bg-white rounded-2xl shadow-md hover:shadow-lg transition flex items-center space-x-5 border border-gray-50">
                        <div class="w-14 h-14 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center text-2xl">
                            <i class="fas fa-envelope"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-gray-900 text-lg">Email</h4>
                            <p class="text-gray-600">support@uloai.com</p>
                            <p class="text-sm text-gray-400">Online support 24/7</p>
                        </div>
                    </div>

                    <div class="p-6 bg-white rounded-2xl shadow-md hover:shadow-lg transition flex items-center space-x-5 border border-gray-50">
                        <div class="w-14 h-14 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-2xl">
                            <i class="fas fa-map-marker-alt"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-gray-900 text-lg">Office</h4>
                            <p class="text-gray-600">Remote/Virtual Office</p>
                            <p class="text-gray-600">Lagos State, Nigeria</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer"></div>

    <script src="js/script.js"></script>
    <script src="js/api_call.js"></script>
</body>
</html>
